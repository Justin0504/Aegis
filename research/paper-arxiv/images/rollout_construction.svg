<text x="808" y="309" font-size="10" fill="#8A8A8A" font-weight="normal" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">before → after, Table 4</text>
<text x="12" y="348" font-size="13.5" fill="#171717" font-weight="bold" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">Why this is the corpus.</text>
<text x="172" y="348" font-size="12" fill="#171717" font-weight="normal" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">An attacker's call exists only after an agent has read an injection and acted on it. Fabricating it plants a shortcut no held-out split can detect;</text>
<text x="12" y="366" font-size="12" fill="#171717" font-weight="normal" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">compromising a live agent and recording what it emits is the only construction in which malicious and benign calls come from the same process.</text>
<text x="12" y="394" font-size="12" fill="#4D4D4D" font-weight="normal" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">The matched control answers the objection that the agent would have called that tool anyway: 0.285 % against 95.07 %. The two benign arms keep the comparison honest:</text>
<text x="12" y="409" font-size="12" fill="#4D4D4D" font-weight="normal" text-anchor="start" font-family="Geist, Inter, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">without the two-step arm, “did untrusted text precede this call?” would separate the classes on its own.</text>
</svg>