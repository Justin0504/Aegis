<text x="808" y="282" font-size="10.5" fill="#4D4D4D" font-weight="normal" text-anchor="start" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace">surface AUC  0.947 → 0.585</text>
