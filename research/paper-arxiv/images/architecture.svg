<text x="50" y="310" font-size="9.5" fill="#15795A" font-weight="bold" text-anchor="start" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">The layers differ in what they may observe, not only in cost — and that is what decides the outcome.</text>
<text x="50" y="326" font-size="8.6" fill="#0F5B44" font-weight="normal" text-anchor="start" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">A successful indirect injection emits a syntactically ordinary call, so L1 and L2 have nothing to inspect. Lp recovers the signal at L1 cost by asking which turn authorised the call.</text>
</svg>